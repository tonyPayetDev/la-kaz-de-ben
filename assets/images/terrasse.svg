<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#3d2314"/>
  
  <!-- Terrasse la nuit -->
  <rect x="0" y="200" width="400" height="100" fill="#2a1810"/>
  
  <!-- Tables -->
  <ellipse cx="100" cy="220" rx="40" ry="15" fill="#5c3a1e"/>
  <ellipse cx="200" cy="210" rx="50" ry="20" fill="#6b4423"/>
  <ellipse cx="320" cy="225" rx="35" ry="12" fill="#5c3a1e"/>
  
  <!-- Chaises -->
  <rect x="70" y="230" width="15" height="30" fill="#4a3728"/>
  <rect x="115" y="230" width="15" height="30" fill="#4a3728"/>
  <rect x="170" y="225" width="18" height="35" fill="#4a3728"/>
  <rect x="215" y="225" width="18" height="35" fill="#4a3728"/>
  
  <!-- Bougies sur tables -->
  <rect x="95" y="205" width="8" height="15" fill="#f5deb3"/>
  <ellipse cx="99" cy="200" rx="5" ry="8" fill="#ff6b35">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <rect x="195" y="195" width="10" height="18" fill="#f5deb3"/>
  <ellipse cx="200" cy="188" rx="6" ry="10" fill="#ff6b35">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Guirlandes -->
  <path d="M0 50 Q100 100 200 50 Q300 0 400 50" stroke="#c9a227" stroke-width="2" fill="none"/>
  <circle cx="50" cy="75" r="5" fill="#ffeb3b"/>
  <circle cx="150" cy="70" r="5" fill="#ffeb3b"/>
  <circle cx="250" cy="30" r="5" fill="#ffeb3b"/>
  <circle cx="350" cy="60" r="5" fill="#ffeb3b"/>
  
  <!-- Plantes -->
  <ellipse cx="40" cy="250" rx="30" ry="40" fill="#228b22" opacity="0.6"/>
  <ellipse cx="360" cy="240" rx="25" ry="35" fill="#32cd32" opacity="0.5"/>
</svg>